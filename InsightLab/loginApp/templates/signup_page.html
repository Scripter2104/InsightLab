<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            background: linear-gradient(135deg, #e5e7eb, #f9fafb);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .signup-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .signup-card:hover {
            transform: translateY(-5px);
        }

        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(45deg, #dc3545, #f87171);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-message {
            animation: shake 0.7s;
        }

        @keyframes shake {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 0); }
            40% { transform: translate(5px, 0); }
            60% { transform: translate(-5px, 0); }
            80% { transform: translate(5px, 0); }
            100% { transform: translate(0); }
        }

        .fade-out {
            opacity: 0;
            transition: opacity 1s ease-out;
        }

        .form-control:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
        }

        .btn-primary {
            background: linear-gradient(90deg, #dc3545, #b91c1c);
            border: none;
            border-radius: 0.5rem;
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            transform: scale(1.02);
        }

        .input-wrapper {
            position: relative;
        }

        .btn-eye {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            background: none;
            border: none;
        }

        @media (max-width: 576px) {
            .signup-card {
                max-width: 100%;
                margin: 0 0.5rem;
            }

            .form-control,
            .btn-primary {
                font-size: 0.9rem;
            }

            .logo {
                width: 48px;
                height: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="signup-card card p-4">
        {% if error %}
            <div class="alert alert-danger alert-dismissible fade show error-message" id="error-message" role="alert">
                {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}

        <div class="text-center mb-4">
            <div class="logo mx-auto">
                <span class="text-white fs-3">🌊</span>
            </div>
            <h2 class="h5 fw-semibold mt-3 text-dark">Create Account</h2>
            <p class="text-muted small">Join us to enjoy exclusive benefits!</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label small fw-medium text-dark">Full Name</label>
                <input type="text" id="username" name="username" placeholder="Enter your full name" class="form-control" required />
            </div>

            <div class="mb-3">
                <label for="email" class="form-label small fw-medium text-dark">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" class="form-control" required />
            </div>

            <div class="input-wrapper mb-3">
                <label for="password" class="form-label small fw-medium text-dark">Password</label>
                <input type="password" id="password" name="password1" placeholder="Create a password" class="form-control" required />
                <button type="button" id="togglePassword" class="btn-eye">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <div class="input-wrapper mb-3">
                <label for="confirm-password" class="form-label small fw-medium text-dark">Confirm Password</label>
                <input type="password" id="confirm-password" name="password2" placeholder="Enter your password again" class="form-control" required />
                <button type="button" id="toggleConfirmPassword" class="btn-eye">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap mt-3">
                <a href="#" class="text-decoration-none small text-primary">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-semibold">Sign Up</button>
        </form>

        <p class="mt-3 text-center text-muted small">
            Already have an account? <a href="{% url 'login' %}" class="text-primary text-decoration-none">Log in</a>
        </p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script>
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirm-password");
        const togglePassword = document.getElementById("togglePassword");
        const toggleConfirmPassword = document.getElementById("toggleConfirmPassword");

        togglePassword.addEventListener("click", function () {
            const type = password.getAttribute("type") === "password" ? "text" : "password";
            password.setAttribute("type", type);
            this.querySelector("i").classList.toggle("fa-eye-slash");
            this.querySelector("i").classList.toggle("fa-eye");
        });

        toggleConfirmPassword.addEventListener("click", function () {
            const type = confirmPassword.getAttribute("type") === "password" ? "text" : "password";
            confirmPassword.setAttribute("type", type);
            this.querySelector("i").classList.toggle("fa-eye-slash");
            this.querySelector("i").classList.toggle("fa-eye");
        });

        confirmPassword.addEventListener("input", function () {
            if (password.value !== confirmPassword.value) {
                confirmPassword.setCustomValidity("Passwords do not match.");
            } else {
                confirmPassword.setCustomValidity("");
            }
        });
    </script>
</body>
</html>
