{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respondent Detail for {{ respondent.first_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- AG-Grid CSS and JS -->
    <link href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-quartz.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">

<div class="max-w-[85rem] px-4 py-10 sm:px-6 lg:px-8 lg:py-14 mx-auto">
    <div class="mb-8 bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-semibold text-slate-800">Respondent details for: {{ respondent.first_name }}</h1>
    </div>

    <!-- AG-Grid Container for detailed answers -->
    <div id="grid" class="ag-theme-quartz p-4 rounded-lg shadow-lg" style="height: 600px; width: 100%;"></div>
</div>

<script>
    // Prepare AG-Grid columns for question answers
    const columnDefs = [
        { headerName: "Index", valueGetter: "node.rowIndex + 1", width: 100, minWidth: 50 },
        { headerName: "Question", field: "question_text", width: 400, minWidth: 250 },
        { headerName: "Your Answer", field: "respondent_answer", width: 250, minWidth: 150 },
        { headerName: "Correct Answer", field: "correct_answer", width: 250, minWidth: 150 },
        { headerName: "Is Correct?",
            field: "is_correct",
            width: 120,
            minWidth: 100,
            cellClassRules: {
                    'bg-red-500': (params) => params.value === 'No',  // Red background for incorrect answers
                    'text-white': (params) => params.value === 'No'   // White text for better visibility
            },
            cellStyle: {
                'textAlign': 'center'  // Center the content of the "Is Correct?" column
            }
         }
    ];

    // Prepare AG-Grid row data from Django template
    const rowData = [
        {% for answer in detailed_answers %}
        {
            question_text: "{{ answer.question.question_text | safe }}",
            respondent_answer: "{{ answer.respondent_answer | safe}}",
            correct_answer: "{{ answer.correct_answer | safe}}",
            is_correct: "{{ answer.is_correct|yesno:'Yes,No' }}"
        },
        {% endfor %}
    ];

    // AG-Grid grid options
    const gridOptions = {
        columnDefs: columnDefs,
        rowData: rowData,
        pagination: true, 
        paginationPageSize: 10, 
        defaultColDef: {
            resizable: true, 
            sortable: true, 
            filter: true, 
        },
        onGridReady: function(params) {
           
            params.api.sizeColumnsToFit();
        }
    };

    // Initialize the AG-Grid with the grid options
    const eGridDiv = document.querySelector('#grid');
    agGrid.createGrid(eGridDiv, gridOptions);

</script>

</body>
</html>
