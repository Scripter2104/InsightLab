{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respondents for {{ test.name|striptags }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- AG-Grid CSS and JS -->
    <link href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-quartz.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">

<div class="max-w-[85rem] px-4 py-10 sm:px-6 lg:px-8 lg:py-14 mx-auto">
    <div class="flex flex-col">
        <div class="overflow-hidden bg-white border border-gray-200 rounded-xl shadow-sm">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-xl font-semibold text-slate-800">Respondents for test: {{ test.name|striptags }}</h2>
            </div>
          
            {% if respondent_data %}
                <!-- AG-Grid Container -->
                <div id="grid" class="ag-theme-quartz p-4 rounded-lg shadow-lg" style="height: 600px; width: 100%;"></div>
            {% else %}
                <div class="px-6 py-4 text-center text-gray-600">
                    <p>No respondents available for this test.</p>
                </div>
            {% endif %}

        </div>
    </div>
</div>

<script>

    

    // Prepare AG-Grid columns
    const columnDefs = [
    { headerName: "Sr. No.", valueGetter: "node.rowIndex + 1", width: 100, minWidth: 80 },
    { headerName: "First Name", field: "first_name", flex: 2, minWidth: 150 },
    { headerName: "Score (%)", field: "percentage", flex: 1, minWidth: 100 },
    { headerName: "Attempted/Total", field: "attempted_total", flex: 2, minWidth: 120 },
    { headerName: "Time Taken (s)", field: "total_time", flex: 1, minWidth: 100 }
];



    // Prepare AG-Grid row data from Django template
    const rowData = [
        {% for data in respondent_data %}
        {
            first_name: "{{ data.respondent.first_name }}",
            percentage: "{{ data.percentage|floatformat:0 }}%",
            attempted_total: "{{ data.total_questions }}/{{ test.questions.count }}",
            total_time: "{{ data.total_time }}",
            respondent_id: "{{ data.respondent.respondent_id }}"
        },
        {% endfor %}
    ];

    // AG-Grid grid options
    const gridOptions = {
        columnDefs: columnDefs,
        rowData: rowData,
        pagination:true, 
        getRowStyle: function(params) {
            return { 'font-size': '14px', 'text-align': 'center' };
        },
        onRowClicked: function(event) {
            const respondentId = event.data.respondent_id;
            if (respondentId) {
                window.location.href = `/respondent/${respondentId}/`;
            }
        }
    };

 
    // Initialize the AG-Grid with the grid options
     {% if respondent_data %}
        const eGridDiv = document.querySelector('#grid');
        agGrid.createGrid(eGridDiv, gridOptions);
        gridOptions.api.sizeColumnsToFit();
    {% endif %}

    
</script>

</body>
</html>
