<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- Google Sign-In Script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            background: linear-gradient(135deg, #e5e7eb, #f9fafb);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(45deg, #dc3545, #f87171);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-message {
            animation: shake 0.7s;
        }

        @keyframes shake {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 0); }
            40% { transform: translate(5px, 0); }
            60% { transform: translate(-5px, 0); }
            80% { transform: translate(5px, 0); }
            100% { transform: translate(0); }
        }

        .fade-out {
            opacity: 0;
            transition: opacity 1s ease-out;
        }

        .form-control:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
        }

        .btn-primary {
            background: linear-gradient(90deg, #dc3545, #b91c1c);
            border: none;
            border-radius: 0.5rem;
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            transform: scale(1.02);
        }

        @media (max-width: 576px) {
            .login-card {
                max-width: 100%;
                margin: 0 0.5rem;
            }

            .form-control,
            .btn-primary {
                font-size: 0.9rem;
            }

            .logo {
                width: 48px;
                height: 48px;
            }

            
        }
    </style>
</head>
<body>
    <div class="login-card card p-4">
        {% if error %}
            <div class="alert alert-danger alert-dismissible fade show error-message" id="error-message" role="alert">
                {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}

        <div class="text-center mb-4">
            <div class="logo mx-auto">
                <span class="text-white fs-3">🌊</span>
            </div>
            <h2 class="h5 fw-semibold mt-3 text-dark">Welcome Back</h2>
            <p class="text-muted small">Please enter your details to sign in.</p>
        </div>

<!--
<div class="d-flex justify-content-center gap-2 mb-4">
    <a href="{
    % url 'social:begin' 'google-oauth2' %}"
       class="btn btn-outline-secondary btn-sm"
       style="width: 48px;">
      <i class="fa-brands fa-google fa-lg"></i>
    </a>
</div>
-->


          <div class="d-flex justify-content-center gap-2 mb-4">
            <a href=""
               class="btn btn-outline-secondary btn-sm"
               style="width: 48px;">
              <i class="fa-brands fa-google fa-lg"></i>
            </a>
            <!-- ... other providers ... -->

          </div>
          

        <div class="d-flex align-items-center mb-4">
            <hr class="flex-grow-1">
            <span class="px-3 text-muted small">OR</span>
            <hr class="flex-grow-1">
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="name" class="form-label small fw-medium text-dark">Username</label>
                <input type="text" id="name" name="username" placeholder="Enter your username..." class="form-control" required />
            </div>

            <div class="position-relative">
                <input type="password" id="password" name="password" placeholder="Enter your password" class="form-control" required />
                
                <!-- Eye icon to toggle visibility -->
                <button type="button" id="togglePassword" class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-decoration-none text-muted">
                    <i class="fas fa-eye"></i> <!-- Font Awesome icon for "show" -->
                </button>
            </div>
            

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap mt-3">
                <a href="#" class="text-decoration-none small text-primary">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-semibold">Sign in</button>
        </form>

        <p class="mt-3 text-center text-muted small">
            Don't have an account? <a href="{% url 'signup' %}" class="text-primary text-decoration-none">Sign Up</a>
        </p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script>
        const password = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {
            const type = password.getAttribute("type") === "password" ? "text" : "password";
            password.setAttribute("type", type);
        
           
            if (type === "password") {
                this.querySelector("i").classList.remove("fa-eye-slash");
                this.querySelector("i").classList.add("fa-eye");
            } else {
                this.querySelector("i").classList.remove("fa-eye");
                this.querySelector("i").classList.add("fa-eye-slash");
            }
        });
        

        document.addEventListener('DOMContentLoaded', function() {
            const errorMessage = document.getElementById('error-message');
            if (errorMessage) {
                setTimeout(() => {
                    errorMessage.classList.add('fade-out');
                    setTimeout(() => errorMessage.remove(), 1000);
                }, 3000);
            }
        });

        window.addEventListener("pageshow", function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        });
    </script>
